name: Generate RSS Feed (Omihachiman City)
on:
  schedule:
    - cron: "10 22 * * *"  # JST 7:10
    - cron: "10 0 * * *"   # JST 9:10
    - cron: "10 2 * * *"   # JST 11:10
    - cron: "10 4 * * *"   # JST 13:10
    - cron: "10 6 * * *"   # JST 15:10
    - cron: "10 8 * * *"   # JST 17:10
    - cron: "10 10 * * *"  # JST 19:10
    - cron: "10 12 * * *"  # JST 21:10
    - cron: "0 17 1 * *"   # 毎月1日 JST 2:00 ハブページ一覧の再構築
  workflow_dispatch: # 手動実行も可能
    inputs:
      rebuild_hubs:
        description: "ハブページ一覧(hubs.json)を再構築する"
        type: boolean
        default: false
      repair_titles:
        description: "既存記事のタイトル・日付・要約を取り直す(修復用)"
        type: boolean
        default: false
      rebuild_items:
        description: "掲載枠から消えた既知記事を復元する(復旧用・複数回実行可)"
        type: boolean
        default: false
permissions:
  contents: write
# 実行が重なるとpushが競合するため、同時に1つしか動かさない
concurrency:
  group: rss-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Rebuild hub list (monthly or manual)
        if: github.event.schedule == '0 17 1 * *' || github.event.inputs.rebuild_hubs == 'true'
        run: |
          set -euo pipefail
          python scripts/discover_hubs.py
      - name: Collect city top-page lists (JSON)
        run: |
          python scripts/fetch_city_lists.py
      - name: Collect from city website
        run: |
          python scripts/watch_hubs_and_generate_rss.py
      - name: Collect from RSS sources
        run: |
          python scripts/fetch_rss_sources.py
      - name: Collect from hub-watch sources
        run: |
          python scripts/watch_hub_sources.py
      - name: Collect from Shiga Police page
        run: |
          python scripts/fetch_shiga_police_omihachiman.py
      - name: Collect from list pages
        run: |
          python scripts/fetch_list_sources.py
      - name: Collect Tabelog new-open shops
        run: |
          python scripts/fetch_tabelog_newopen.py
      - name: Collect Omihachiman council video
        run: |
          python scripts/fetch_council_video.py
      - name: Collect NO-MA archive exhibitions
        run: |
          python scripts/fetch_noma_archive.py
      - name: Collect Omihachiman official YouTube channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/fetch_youtube_channel.py
      - name: Collect from section pages
        run: |
          python scripts/fetch_section_links.py
      - name: Repair existing titles and dates (manual only)
        if: github.event.inputs.repair_titles == 'true'
        run: |
          python tools/repair_titles.py
      - name: Rebuild items from known links (manual only)
        if: github.event.inputs.rebuild_items == 'true'
        run: |
          python tools/rebuild_from_known.py
      - name: Build RSS feed
        run: |
          set -euo pipefail
          python scripts/build_feed.py
      - name: Commit and Push RSS
        run: |
          git add hubs.json dept_names.json known_links.json rss.xml rss_items.json feed_fingerprint.txt sitemap.xml
          if git diff --quiet --cached; then
            echo "No changes in rss.xml. Skipping commit."
            exit 0
          fi
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git commit -m "Updated RSS feed"

          if git push; then
            echo "Push succeeded."
            exit 0
          fi

          # 競合した場合、自動生成されたJSONファイルはテキストとして
          # 安全に混ぜ合わせられないため、無理なrebaseはしない。
          # リモート側を正として今回の収集結果は諦める(次回実行で再収集される)。
          echo "Push rejected. Discarding this run's changes and deferring to the next run."
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          echo "今回の更新は破棄しました。次回の実行で改めて収集されます。"
          exit 0

      # 収集スクリプトは1つが失敗しても他を止めないため、失敗はここでまとめて確認する。
      # 失敗があれば実行を「失敗」にして、GitHubのメール通知で気づけるようにする。
      - name: Report collection failures
        if: always()
        run: |
          if [ -s warnings.log ]; then
            {
              echo "### 警告(失敗しても実行は成功扱いにしているスクリプト)"
              echo '```'
              cat warnings.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s failures.log ]; then
            {
              echo "### 収集に失敗したスクリプト"
              echo '```'
              cat failures.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::収集に失敗したスクリプトがあります。上の注釈と要約を確認してください。"
            exit 1
          fi
          echo "収集の失敗はありませんでした。"
