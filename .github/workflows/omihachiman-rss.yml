name: Generate RSS Feed (Omihachiman City)
on:
  schedule:
    - cron: "10 1 * * *"   # JST 10:10
    - cron: "10 5 * * *"   # JST 14:10
    - cron: "10 8 * * *"   # JST 17:10
    - cron: "0 17 1 * *"   # 毎月1日 JST 2:00 ハブページ一覧の再構築
  workflow_dispatch: # 手動実行も可能
    inputs:
      rebuild_hubs:
        description: "ハブページ一覧(hubs.json)を再構築する"
        type: boolean
        default: false
      repair_titles:
        description: "既存記事のタイトルを取り直す(不具合修復用)"
        type: boolean
        default: false
permissions:
  contents: write
# 実行が重なるとpushが競合するため、同時に1つしか動かさない
concurrency:
  group: rss-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      - name: Rebuild hub list (monthly or manual)
        if: github.event.schedule == '0 17 1 * *' || github.event.inputs.rebuild_hubs == 'true'
        run: |
          set -euo pipefail
          python discover_hubs.py
      - name: Collect from city website
        run: |
          python watch_hubs_and_generate_rss.py
      - name: Collect from RSS sources
        run: |
          python fetch_rss_sources.py
      - name: Collect from hub-watch sources
        run: |
          python watch_hub_sources.py
      - name: Collect from Shiga Police page
        run: |
          python fetch_shiga_police_omihachiman.py
      - name: Collect from list pages
        run: |
          python fetch_list_sources.py
      - name: Collect from section pages
        run: |
          python fetch_section_links.py
      - name: Repair existing titles (manual only)
        if: github.event.inputs.repair_titles == 'true'
        run: |
          python repair_titles.py
      - name: Build RSS feed
        run: |
          set -euo pipefail
          python build_feed.py
      - name: Commit and Push RSS
        run: |
          git add hubs.json hub_cursor.json known_links.json rss.xml rss_items.json feed_fingerprint.txt
          if git diff --quiet --cached; then
            echo "No changes in rss.xml. Skipping commit."
            exit 0
          fi
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git commit -m "Updated RSS feed"
          # 実行が重なった場合に備え、最新を取り込んでから数回まで再試行する
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Retrying after rebase ($i/3)..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "Push failed after retries."
          exit 1
