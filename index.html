<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近江八幡市.com</title>
<meta name="description" content="近江八幡市に関する各種公式サイトの新着情報をまとめた非公式サイトです。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F6F3EC'/%3E%3Cpath d='M4 20 L16 8 L28 20 Z' fill='none' stroke='%238C3B2E' stroke-width='2'/%3E%3Cline x1='4' y1='24' x2='28' y2='24' stroke='%232B2A26' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EC;
    --bg-panel: #FBFAF6;
    --ink: #2B2A26;
    --ink-soft: #6B6558;
    --line: #DED7C8;
    --important: #8C3B2E;
    --news: #35586B;
    --bosyu: #8A6A17;
    --event: #4B6A53;
    --dept: #5B5850;
    --external: #6B4A85;
    --focus: #1F5FA8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ---- Hero ---- */
  .hero {
    position: relative;
    padding: 56px 20px 40px;
    text-align: center;
    overflow: hidden;
  }

  .hero svg.wave {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 60px;
    opacity: 0.35;
  }

  .hero h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 0.04em;
    margin: 0 0 10px;
  }

  .hero p.lead {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 46ch;
    margin-inline: auto;
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero h1 { animation: rise 0.6s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- Notice banner ---- */
  .notice {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }
  .notice strong { color: var(--ink); }
  .notice a { text-decoration: underline; text-underline-offset: 2px; }

  /* ---- Meta row ---- */
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---- Filters ---- */
  nav.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }
  nav.filters button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink-soft);
    cursor: pointer;
  }
  nav.filters button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg-panel);
    border-color: var(--ink);
  }
  nav.filters button:focus-visible,
  a:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---- Date groups ---- */
  .day-group { margin-bottom: 30px; }
  .day-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  ul.items { list-style: none; margin: 0; padding: 0; }
  .item {
    display: grid;
    grid-template-columns: 4px 1fr;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item .bar { border-radius: 2px; }
  .item.cat-event .bar     { background: var(--event); }
  .item.cat-kns .bar       { background: var(--important); }
  .item.cat-kosodate .bar  { background: var(--bosyu); }
  .item.cat-gomi .bar      { background: var(--event); }
  .item.cat-juminhyou .bar { background: var(--news); }
  .item.cat-kenkoiryo .bar { background: var(--important); }
  .item.cat-hikkoshi .bar  { background: var(--dept); }
  .item.cat-okuyami .bar   { background: var(--dept); }
  .item.cat-kaigo .bar     { background: var(--external); }
  .item.cat-zeikin .bar    { background: var(--bosyu); }
  .item.cat-other .bar     { background: var(--line); }

  .item .tag {
    font-size: 12px;
    font-weight: 500;
  }
  .item.cat-event .tag     { color: var(--event); }
  .item.cat-kns .tag       { color: var(--important); }
  .item.cat-kosodate .tag  { color: var(--bosyu); }
  .item.cat-gomi .tag      { color: var(--event); }
  .item.cat-juminhyou .tag { color: var(--news); }
  .item.cat-kenkoiryo .tag { color: var(--important); }
  .item.cat-hikkoshi .tag  { color: var(--dept); }
  .item.cat-okuyami .tag   { color: var(--dept); }
  .item.cat-kaigo .tag     { color: var(--external); }
  .item.cat-zeikin .tag    { color: var(--bosyu); }
  .item.cat-other .tag     { color: var(--ink-soft); }

  .item a.title {
    display: block;
    font-size: 16px;
    font-weight: 500;
    margin-top: 3px;
    text-decoration: none;
  }
  .item a.title:hover,
  .item a.title:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

  .item .url {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
    word-break: break-all;
  }

  /* ---- States ---- */
  .state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 60px 20px;
  }

  details.about {
    margin-top: 40px;
    font-size: 13.5px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  details.about summary {
    cursor: pointer;
    color: var(--ink);
    font-weight: 500;
  }
  details.about div { margin-top: 10px; }
  details.about ul { padding-left: 18px; }

  footer.site {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 50px;
  }
  footer.site a { text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>

<div class="hero">
  <h1>近江八幡市.com</h1>
  <p class="lead">市公式サイトをはじめ、公共性の高い新着情報をまとめています</p>
  <svg class="wave" viewBox="0 0 720 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 Q 60 10 120 30 T 240 30 T 360 30 T 480 30 T 600 30 T 720 30" fill="none" stroke="#4B6A53" stroke-width="2"/>
    <path d="M0 42 Q 60 22 120 42 T 240 42 T 360 42 T 480 42 T 600 42 T 720 42" fill="none" stroke="#35586B" stroke-width="1.5"/>
  </svg>
</div>

<div class="wrap">

  <div class="notice">
    <strong>このサイトは近江八幡市の公式サイトではありません。</strong>
    近江八幡市に関する各種公式サイトの新着情報をまとめた非公式のサイトです。
    正式な情報は必ず各種公式サイトでご確認ください。
  </div>

  <div class="meta-row">
    <span id="updated-at">読み込み中...</span>
    <span id="item-count"></span>
  </div>

  <nav class="filters" id="filters" aria-label="カテゴリで絞り込み"></nav>

  <main id="content">
    <div class="state">情報を読み込んでいます...</div>
  </main>

  <footer class="site">
    <p>個人により運営される非公式サイトです</p>
  </footer>

</div>

<script>
(function () {
  const CITY_HOST = 'www.city.omihachiman.lg.jp';

  const SOURCE_BY_HOST = {
    'www.city.omihachiman.lg.jp': '近江八幡市公式サイト',
    'omihachiman.keizai.biz': '近江八幡経済新聞',
    'higashiomi-omihachiman.goguynet.jp': '号外NET',
    'www.omi8.com': '近江八幡市観光サイト',
    'www.kenkou1.com': '近江八幡市立総合医療センター',
    'www.pref.shiga.lg.jp': '近江八幡警察署(滋賀県警)',
    'library.city.omihachiman.shiga.jp': '近江八幡市立図書館',
    'bungei.or.jp': '安土文芸の郷',
    '8cci.com': '近江八幡商工会議所',
    'taneya.jp': 'ラコリーナ近江八幡',
    'ohshakyo.or.jp': '近江八幡市社会福祉協議会',
    'www.zd.ztv.ne.jp': '安土学区まちづくり協議会',
    'azuchi-shiga.com': '安土学区まちづくり協議会',
    'azuchi-museum.blogspot.com': '安土城考古博物館長のつぶやき',
    'azuchi-museum.or.jp': '安土城考古博物館',
    'www.shiga-bunkazai.jp': 'シガブンシンブン(滋賀県文化財保護協会)',
    'www.azuchi-museum.or.jp': '安土城考古博物館',
    'www.omihachiman-shiryoukan-kawara.jp': '近江八幡市立資料館・かわらミュージアム',
    'www.omi8man-kenkofureai.jp': '近江八幡市立健康ふれあい公園',
    'www.8cci.com': '近江八幡商工会議所',
    'www.bungei.or.jp': '安土文芸の郷',
  };

  function sourceFromUrl(url) {
    try {
      const host = new URL(url).hostname;
      return SOURCE_BY_HOST[host] || host;
    } catch (e) {
      return '不明';
    }
  }
  // 市の「目的別で探す」に倣った分類タグ。
  // 各記事にはこのうち最大2つまで付ける。「すべて」「イベント情報」はこの数に含めない。
  const TOPIC_TAGS = [
    { key: 'kns',       label: '結婚･妊娠･出産', words: ['結婚', '婚姻', '妊娠', '出産', '産後', '不妊', '母子健康手帳', '乳児', '新生児', '婚活'] },
    { key: 'kosodate',  label: '子育て･教育',   words: ['子育て', '保育', '幼稚園', 'こども園', '児童', '学童', '小学校', '中学校', '学校', '教育', '給食', '子ども', 'こども', '青少年', 'PTA', '就学'] },
    { key: 'gomi',      label: 'ごみ･リサイクル', words: ['ごみ', 'ゴミ', 'resource', 'リサイクル', '分別', '収集', '廃棄物', '粗大', '清掃', 'environment', '不法投棄'] },
    { key: 'juminhyou', label: '住民票･証明',   words: ['住民票', '証明', 'マイナンバー', 'マイナ', '戸籍', '印鑑', '登録', '窓口', '交付', 'パスポート'] },
    { key: 'kenkoiryo', label: '健康･医療',     words: ['健康', '医療', '検診', '健診', '予防接種', 'ワクチン', '感染', '保健', '病院', '診療', 'こころ', 'がん', '献血', '食育'] },
    { key: 'hikkoshi',  label: '引っ越し･住まい', words: ['引っ越し', '転入', '転出', '転居', '住まい', '住宅', '空き家', '建築', '耐震', '上下水道', '水道', '下水', '排水', '道路', '都市計画', '景観', 'マンション'] },
    { key: 'okuyami',   label: 'おくやみ',       words: ['おくやみ', '死亡', '葬', '相続', '火葬', '墓地', '遺族'] },
    { key: 'kaigo',     label: '高齢･障がい･介護', words: ['高齢', '介護', '障がい', '障害', '福祉', '年金', 'シニア', '認知症', '地域包括', 'ボランティア', '生活支援'] },
    { key: 'zeikin',    label: '税金',           words: ['税', '納付', '課税', '申告', '控除', 'ふるさと納税', '国保', '保険料'] },
  ];

  const EVENT_TAG = { key: 'event', label: 'イベント情報' };

  // イベント情報とみなす手がかり
  const EVENT_WORDS = ['イベント', 'まつり', '祭', 'フェス', '開催', '講座', '教室', '展', 'ツアー', 'コンサート', '体験', 'ワークショップ', '募集', '大会', '上映', 'マルシェ'];
  // このサイトからの記事は地域のイベント・話題として扱う
  const EVENT_HOSTS = new Set([
    'www.omi8.com', 'omihachiman.keizai.biz', 'higashiomi-omihachiman.goguynet.jp',
    'taneya.jp', 'bungei.or.jp', 'www.bungei.or.jp', 'azuchi-museum.or.jp',
    'azuchi-museum.blogspot.com', 'www.omihachiman-shiryoukan-kawara.jp',
    'www.zd.ztv.ne.jp', 'azuchi-shiga.com', 'www.omi8man-kenkofureai.jp',
  ]);

  let deptNames = {};  // 部署slug -> 課名

  function departmentOf(url) {
    try {
      const u = new URL(url);
      if (u.hostname !== CITY_HOST) return null;
      const m = u.pathname.match(/^\/soshiki\/([^/]+)\//);
      return m ? (deptNames[m[1]] || null) : null;
    } catch (e) {
      return null;
    }
  }

  function isEventItem(url, title) {
    try {
      const u = new URL(url);
      if (EVENT_HOSTS.has(u.hostname)) return true;
      if (u.hostname === CITY_HOST && u.pathname.startsWith('/event/')) return true;
    } catch (e) { /* fall through */ }
    return EVENT_WORDS.some((w) => title.includes(w));
  }

  function topicTagsOf(url, title, dept) {
    // タイトル・URL・課名を手がかりに、当てはまるタグを最大2つ選ぶ
    let path = '';
    try { path = decodeURIComponent(new URL(url).pathname); } catch (e) { /* noop */ }
    const haystack = `${title} ${path} ${dept || ''}`;

    const scored = [];
    for (const tag of TOPIC_TAGS) {
      let score = 0;
      for (const w of tag.words) {
        if (haystack.includes(w)) score += 1;
      }
      if (score > 0) scored.push({ tag, score });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 2).map((s) => s.tag);
  }

  function formatDay(date) {
    return date.toLocaleDateString('ja-JP', {
      timeZone: 'Asia/Tokyo', month: 'long', day: 'numeric', weekday: 'short'
    });
  }
  function formatUpdated(date) {
    return date.toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }

  let allItems = [];
  let activeFilter = 'all';

  function render() {
    const content = document.getElementById('content');
    const filtered = activeFilter === 'all'
      ? allItems
      : allItems.filter((it) => it.tags.some((t) => t.key === activeFilter));

    document.getElementById('item-count').textContent = `${filtered.length}件表示中`;

    if (filtered.length === 0) {
      content.innerHTML = '<div class="state">該当するお知らせはまだありません。</div>';
      return;
    }

    // 日付ごとにグループ化
    const groups = new Map();
    for (const it of filtered) {
      const key = formatDay(it.date);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }

    let html = '';
    for (const [day, items] of groups) {
      html += `<section class="day-group"><h2 class="day-label">${day}</h2><ul class="items">`;
      for (const it of items) {
        html += `
          <li class="item cat-${it.tags[0] ? it.tags[0].key : 'other'}">
            <span class="bar" aria-hidden="true"></span>
            <div>
              <span class="tag">${it.tags.map((t) => escapeHtml(t.label)).join(' / ') || 'お知らせ'}</span>
              <a class="title" href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
              <div class="url">出典：${escapeHtml(it.sourceLabel)}</div>
            </div>
          </li>`;
      }
      html += `</ul></section>`;
    }
    content.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildFilters() {
    const counts = {};
    for (const it of allItems) {
      for (const t of it.tags) {
        counts[t.key] = (counts[t.key] || 0) + 1;
      }
    }
    const options = [
      { key: 'all', label: 'すべて' },
      EVENT_TAG,
      ...TOPIC_TAGS,
    ].filter((o) => o.key === 'all' || counts[o.key] > 0);

    const nav = document.getElementById('filters');
    nav.innerHTML = '';
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.textContent = opt.label;
      btn.setAttribute('aria-pressed', String(opt.key === activeFilter));
      btn.addEventListener('click', () => {
        activeFilter = opt.key;
        [...nav.children].forEach((b) => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        render();
      });
      nav.appendChild(btn);
    }
  }

  function fetchJsonSafe(path) {
    // manual_items.json はまだ存在しない場合があるため、失敗時は空配列として扱う
    return fetch(path, { cache: 'no-store' })
      .then((res) => (res.ok ? res.json() : []))
      .catch(() => []);
  }

  Promise.all([
    fetchJsonSafe('./rss_items.json'),
    fetchJsonSafe('./manual_items.json'),
    fetchJsonSafe('./dept_names.json'),
  ])
    .then(([rssData, manualData, deptData]) => {
      deptNames = (deptData && !Array.isArray(deptData)) ? deptData : {};
      if (rssData.length === 0 && manualData.length === 0) {
        throw new Error('情報を取得できませんでした');
      }

      const combined = [...rssData, ...manualData].map((it) => {
        const source = it.source || sourceFromUrl(it.link);
        const dept = departmentOf(it.link);
        const tags = [];
        if (isEventItem(it.link, it.title)) tags.push(EVENT_TAG);
        tags.push(...topicTagsOf(it.link, it.title, dept));
        return {
          title: it.title,
          link: it.link,
          date: new Date(it.pubDate),
          tags,
          // 「各課」ではなく実際の課名を出す
          sourceLabel: dept ? `${source}（${dept}）` : source,
        };
      });

      combined.sort((a, b) => b.date - a.date);
      allItems = combined;

      document.getElementById('updated-at').textContent = allItems.length > 0
        ? `最終確認: ${formatUpdated(allItems[0].date)}`
        : '最終確認: -';

      buildFilters();
      render();
    })
    .catch((err) => {
      document.getElementById('content').innerHTML =
        '<div class="state">情報を取得できませんでした。ページを再読み込みするか、しばらく経ってからお試しください。</div>';
      document.getElementById('updated-at').textContent = '';
      console.error(err);
    });
})();
</script>

</body>
</html>
