<title>近江八幡市.com</title>
<meta name="description" content="近江八幡市に関する各種公式サイトの新着情報をまとめた非公式サイトです。">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  :root{
    --take:#2F6B5B;      /* 青竹 */
    --wakaba:#8FAE6B;    /* 若葉 */
    --inaho:#C9A227;     /* 稲穂 */
    --mizu:#EAF2EE;
    --ink:#23302C;
    --ink-soft:#5C6B65;
    --line:#E2EAE5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:#fff;color:var(--ink);
    font-family:"Noto Sans JP",system-ui,sans-serif;font-size:17px;line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* --- 朝のヨシ原 --- */
  .hero{position:relative;overflow:hidden;
    background:linear-gradient(180deg,#FFFDF6 0%,#F4F9F4 58%,#FFFFFF 100%)}
  .hero-inner{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:70px 24px 108px;text-align:center}
  .brand{
    font-family:"Zen Maru Gothic",system-ui,sans-serif;font-weight:700;margin:0;
    font-size:clamp(33px,6.2vw,56px);letter-spacing:.04em;color:var(--take);
  }
  .lead{margin:16px auto 0;max-width:26em;color:var(--ink-soft);font-size:16px}
  .reeds{position:absolute;left:0;right:0;bottom:-2px;height:150px;z-index:1}
  .reeds svg{display:block;width:100%;height:100%}
  .reed{transform-origin:bottom center;animation:sway 7s ease-in-out infinite}
  .reed:nth-child(2n){animation-duration:9s;animation-delay:-1.4s}
  .reed:nth-child(3n){animation-duration:11s;animation-delay:-2.7s}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
  .sun{position:absolute;top:44px;right:12%;width:88px;height:88px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,39,.32),rgba(201,162,39,0) 70%);z-index:1}

  .wrap{max-width:880px;margin:0 auto;padding:0 24px 80px}
  .notice{background:var(--mizu);border-radius:12px;padding:16px 20px;margin:30px 0 0;
    font-size:14.5px;color:var(--ink-soft)}
  .notice strong{color:var(--take);font-weight:700}

  .meta-row{display:flex;justify-content:space-between;gap:16px;margin:28px 0 12px;font-size:13.5px;color:var(--ink-soft)}
  .search-row{margin:0 0 18px}
  #search-box{width:100%;padding:15px 18px;font:inherit;font-size:16px;background:#fff;color:var(--ink);
    border:2px solid var(--line);border-radius:12px;outline:none}
  #search-box:focus{border-color:var(--wakaba);box-shadow:0 0 0 4px rgba(143,174,107,.18)}

  .filters{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 32px}
  .filters button{font:inherit;font-size:14.5px;padding:9px 17px;cursor:pointer;color:var(--ink-soft);
    background:#fff;border:2px solid var(--line);border-radius:999px}
  .filters button:hover{border-color:var(--wakaba);color:var(--take)}
  .filters button[aria-pressed="true"]{background:var(--take);border-color:var(--take);color:#fff}
  .filters button:focus-visible{outline:3px solid var(--inaho);outline-offset:2px}

  .day-group{margin:0 0 30px}
  .day-label{display:inline-block;font-family:"Zen Maru Gothic",sans-serif;font-size:15px;font-weight:700;
    color:#fff;background:var(--take);padding:5px 15px;border-radius:999px;margin:0 0 14px}
  .items{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .item{display:flex;gap:14px;padding:18px 20px;background:#fff;
    border:1px solid var(--line);border-radius:14px}
  .item .bar{flex:none;width:5px;border-radius:3px;background:var(--wakaba)}
  .tag{display:inline-block;font-size:12.5px;color:var(--take);background:var(--mizu);
    padding:2px 10px;border-radius:999px;margin:0 0 7px}
  .title{display:block;font-family:"Zen Maru Gothic",sans-serif;font-size:18.5px;font-weight:700;
    line-height:1.65;color:var(--ink);text-decoration:none}
  .title:hover{color:var(--take);text-decoration:underline;text-underline-offset:4px}
  .summary{margin:9px 0 0;font-size:14.5px;line-height:1.95;color:var(--ink-soft)}
  .url{margin-top:9px;font-size:13px;color:#7C8A84}
  .state{padding:52px 0;text-align:center;color:var(--ink-soft)}

  footer.site{margin-top:46px;padding-top:24px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft)}
  footer.site p{margin:6px 0}
  footer.site a{color:var(--take);text-decoration:underline;text-underline-offset:2px}

  @media (max-width:640px){
    .hero-inner{padding:52px 20px 86px}
    .wrap{padding:0 20px 60px}
    .sun{right:6%;width:64px;height:64px}
  }
  @media (prefers-reduced-motion:reduce){ .reed{animation:none} }

</style>
</head>

    const weak = summary || '';                        // 補助的な手がかり

    const scored = [];
    for (const tag of TOPIC_TAGS) {
      let strongScore = 0;
      let weakScore = 0;
      for (const w of tag.words) {
        if (strong.includes(w)) strongScore += 1;
        else if (weak.includes(w)) weakScore += 1;
      }
      // タイトル等に根拠がないタグは付けない
      if (strongScore > 0) scored.push({ tag, score: strongScore * 10 + weakScore });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 3).map((s) => s.tag);
  }

  function formatDay(date) {
    return date.toLocaleDateString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    });
  }
  function formatUpdated(date) {
    return date.toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  let allItems = [];
  let activeFilter = 'all';
  let searchQuery = '';

  function render() {
    const content = document.getElementById('content');
    let filtered = activeFilter === 'all'
      ? allItems
      : allItems.filter((it) => it.tags.some((t) => t.key === activeFilter));
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter((it) =>
        it.title.toLowerCase().includes(q)
        || it.sourceLabel.toLowerCase().includes(q)
        || it.summary.toLowerCase().includes(q)
      );
    }

    document.getElementById('item-count').textContent = `${filtered.length}件表示中`;

    if (filtered.length === 0) {
      content.innerHTML = '<div class="state">該当するお知らせはまだありません。</div>';
      return;
    }

    // 日付ごとにグループ化
    const groups = new Map();
    for (const it of filtered) {
      const key = formatDay(it.date);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }

    let html = '';
    for (const [day, items] of groups) {
      html += `<section class="day-group"><h2 class="day-label">${day}</h2><ul class="items">`;
      for (const it of items) {
        html += `
          <li class="item cat-${it.tags[0] ? it.tags[0].key : 'other'}">
            <span class="bar" aria-hidden="true"></span>
            <div>
              <span class="tag">${it.tags.map((t) => escapeHtml(t.label)).join(' / ') || 'お知らせ'}</span>
              <a class="title" href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
              ${it.summary ? `<p class="summary">${escapeHtml(it.summary)}</p>` : ''}
              <div class="url">出典：${escapeHtml(it.sourceLabel)}</div>
            </div>
          </li>`;
      }
      html += `</ul></section>`;
    }
    content.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildFilters() {
    const counts = {};
    for (const it of allItems) {
      for (const t of it.tags) {
        counts[t.key] = (counts[t.key] || 0) + 1;
      }
    }
    const options = [
      { key: 'all', label: 'すべて' },
      EVENT_TAG,
      ...TOPIC_TAGS,
    ].filter((o) => o.key === 'all' || counts[o.key] > 0);

    const nav = document.getElementById('filters');
    nav.innerHTML = '';
    for (const opt of options) {
      const btn = document.createElement('button');
      btn.textContent = opt.label;
      btn.setAttribute('aria-pressed', String(opt.key === activeFilter));
      btn.addEventListener('click', () => {
        activeFilter = opt.key;
        [...nav.children].forEach((b) => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        render();
      });
      nav.appendChild(btn);
    }
  }

  function fetchJsonSafe(path) {
    // manual_items.json はまだ存在しない場合があるため、失敗時は空配列として扱う
    return fetch(path, { cache: 'no-store' })
      .then((res) => (res.ok ? res.json() : []))
      .catch(() => []);
  }

  Promise.all([
    fetchJsonSafe('./rss_items.json'),
    fetchJsonSafe('./manual_items.json'),
    fetchJsonSafe('./dept_names.json'),
  ])
    .then(([rssData, manualData, deptData]) => {
      deptNames = (deptData && !Array.isArray(deptData)) ? deptData : {};
      if (rssData.length === 0 && manualData.length === 0) {
        throw new Error('情報を取得できませんでした');
      }

      const combined = [...rssData, ...manualData].map((it) => {
        const source = it.source || sourceFromUrl(it.link);
        const dept = departmentOf(it.link);
        const tags = [];
        if (isEventItem(it.link, it.title)) tags.push(EVENT_TAG);
        tags.push(...topicTagsOf(it.link, it.title, dept, it.description || ''));
        return {
          title: it.title,
          link: it.link,
          date: new Date(it.pubDate),
          summary: (it.description || '').trim(),
          tags,
          sourceLabel: sourceLabelOf(source, dept),
        };
      });

      combined.sort((a, b) => b.date - a.date);
      allItems = combined;

      document.getElementById('updated-at').textContent = allItems.length > 0
        ? `最終確認: ${formatUpdated(allItems[0].date)}`
        : '最終確認: -';

      buildFilters();
      document.getElementById('search-box').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        render();
      });
      render();
    })
    .catch((err) => {
      document.getElementById('content').innerHTML =
        '<div class="state">情報を取得できませんでした。ページを再読み込みするか、しばらく経ってからお試しください。</div>';
      document.getElementById('updated-at').textContent = '';
      console.error(err);
    });
})();
</script>
</body>
</html>
